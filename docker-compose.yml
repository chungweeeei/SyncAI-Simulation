include:
  - robots/robot01.yml
  - robots/robot02.yml

services:
  sim:
    build:
      context: ./sim_ws
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: syncai-simulation-base-image:latest
    container_name: syncai-iot-server

    depends_on:
      postgresql:
        condition: service_healthy

    runtime: nvidia
    environment:
      # X11 forwarding
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/home/ubuntu/.Xauthority

      # NVIDIA settings
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

      # ROS 2 DDS settings
      - ROS_DOMAIN_ID=0
      - CYCLONEDDS_URI=file:///home/ubuntu/sim_ws/config/cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

      # syncai_wms PostgreSQL settings
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SYNCAI_WMS_DB_HOST=localhost
      - SYNCAI_WMS_DB_PORT=5432

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/home/ubuntu/.Xauthority:ro
      - ./sim_ws:/home/ubuntu/sim_ws
      - ./data:/home/ubuntu/data
      - ./map:/home/ubuntu/map:ro

    network_mode: host
    stdin_open: true
    tty: true
    restart: unless-stopped
  
  postgresql:
    container_name: postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    image: postgres:18
    network_mode: host
    volumes:
      - ./data/db_data:/var/lib/postgresql
    tmpfs:
      - /tmp
      - /run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin
    depends_on:
      - postgresql
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_LISTEN_PORT=${PGADMIN_LISTEN_PORT}
    image: dpage/pgadmin4:latest
    network_mode: host
    restart: unless-stopped

  temporal:
    container_name: temporal
    depends_on:
      - postgresql
    environment:
      - DB=${TEMPORAL_DB}
      - DB_PORT=${TEMPORAL_DB_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=127.0.0.1
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS}
      - TEMPORAL_CLI_ADDRESS=${TEMPORAL_CLI_ADDRESS}
      - BIND_ON_IP=0.0.0.0
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    network_mode: host
    tmpfs:
      - /tmp
      - /run
    restart: unless-stopped

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS}
      - TEMPORAL_CORS_ORIGINS=${TEMPORAL_CORS_ORIGINS}
      - TEMPORAL_UI_AUTH_DISABLED=true
      - TEMPORAL_UI_CSRF_COOKIE_INSECURE=true
      - TEMPORAL_UI_PORT=${TEMPORAL_UI_PORT}
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    network_mode: host
    tmpfs:
      - /tmp
      - /run
    restart: unless-stopped
