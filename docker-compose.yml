include:
  - robots/robot01.yml

services:
  postgresql:
    container_name: postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    image: postgres:18
    ports:
      - 5432:5432
    volumes:
      - ./data/db_data:/var/lib/postgresql
    tmpfs:
      - /tmp
      - /run
    networks:
      - syncai-network
    restart: unless-stopped

  temporal:
    container_name: temporal
    depends_on:
      - postgresql
    environment:
      - DB=${TEMPORAL_DB}
      - DB_PORT=${TEMPORAL_DB_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgresql
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS}
      - TEMPORAL_CLI_ADDRESS=${TEMPORAL_CLI_ADDRESS}
      - BIND_ON_IP=0.0.0.0
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    ports:
      - 7233:7233
    tmpfs:
      - /tmp
      - /run
    networks:
      - syncai-network
    restart: unless-stopped

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS}
      - TEMPORAL_CORS_ORIGINS=${TEMPORAL_CORS_ORIGINS}
      - TEMPORAL_UI_AUTH_DISABLED=true
      - TEMPORAL_UI_CSRF_COOKIE_INSECURE=true
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    ports:
      - ${TEMPORAL_UI_PORT}:8080
    tmpfs:
      - /tmp
      - /run
    networks:
      - syncai-network
    restart: unless-stopped

networks:
  syncai-network:
    external: true
    name: syncai-network
