include:
  - robots/robot01.yml
  - robots/robot02.yml

services:
  postgresql:
    container_name: postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    image: postgres:18
    network_mode: host
    volumes:
      - ./data/db_data:/var/lib/postgresql
    tmpfs:
      - /tmp
      - /run
    restart: unless-stopped

  temporal:
    container_name: temporal
    depends_on:
      - postgresql
    environment:
      - DB=${TEMPORAL_DB}
      - DB_PORT=${TEMPORAL_DB_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=127.0.0.1
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS}
      - TEMPORAL_CLI_ADDRESS=${TEMPORAL_CLI_ADDRESS}
      - BIND_ON_IP=0.0.0.0
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    network_mode: host
    tmpfs:
      - /tmp
      - /run
    restart: unless-stopped

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS}
      - TEMPORAL_CORS_ORIGINS=${TEMPORAL_CORS_ORIGINS}
      - TEMPORAL_UI_AUTH_DISABLED=true
      - TEMPORAL_UI_CSRF_COOKIE_INSECURE=true
      - TEMPORAL_UI_PORT=${TEMPORAL_UI_PORT}
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    network_mode: host
    tmpfs:
      - /tmp
      - /run
    restart: unless-stopped
