services:
  robot01:
    extends:
      file: base.yml
      service: robot
    container_name: syncai-robot01
    environment:
      - SYNCAI_API_PORT=3000
    volumes:
      - ../data/robot01:/home/ubuntu/data
      - ../data/robot01/ros_ws/install:/home/ubuntu/robot_ws/install
      - ../data/robot01/ros_ws/build:/home/ubuntu/robot_ws/build
      - ../data/robot01/ros_ws/log:/home/ubuntu/robot_ws/log

  robot01-bridge:
    extends:
      file: base.yml
      service: bridge
    container_name: syncai-robot01-bridge
    environment:
      - GRPC_LISTEN_ADDR=:50051
      - ROBOT_ID=robot01
      - ROBOT_API_URL=http://localhost:3000
    volumes:
      - ../data/robot01:/home/ubuntu/data
    depends_on:
      - robot01
 
  robot01-backend:
    extends:
      file: base.yml
      service: backend
    container_name: syncai-robot01-backend
    environment:
      - PORT=3001
      - ROBOT_API_URL=http://localhost:3000
      - BRIDGE_GRPC_ADDRESS=localhost:50051
    depends_on:
      - postgresql
      - temporal