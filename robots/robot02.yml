services:
  robot02:
    extends:
      file: base.yml
      service: robot
    container_name: syncai-robot02
    volumes:
      - ../data/robot02:/home/ubuntu/data

  robot02-bridge:
    extends:
      file: base.yml
      service: bridge
    container_name: syncai-robot02-bridge
    environment:
      - ROBOT_ID=robot02
      - ROBOT_API_URL=http://syncai-robot02:3000
    volumes:
      - ../data/robot02:/home/ubuntu/data
    depends_on:
      - robot02

  robot02-backend:
    extends:
      file: base.yml
      service: backend
    container_name: syncai-robot02-backend
    environment:
      - ROBOT_API_URL=http://syncai-robot02:3000
      - BRIDGE_GRPC_ADDRESS=syncai-robot02-bridge:50051
    ports:
      - "3002:3000"
    depends_on:
      - postgresql
      - temporal
