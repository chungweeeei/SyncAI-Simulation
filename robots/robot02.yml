services:
  robot02:
    extends:
      file: base.yml
      service: robot
    container_name: syncai-robot02
    environment:
      - SYNCAI_API_PORT=4000
    volumes:
      - ../data/robot02:/home/ubuntu/data
      - ../data/robot02/ros_ws/install:/home/ubuntu/robot_ws/install
      - ../data/robot02/ros_ws/build:/home/ubuntu/robot_ws/build
      - ../data/robot02/ros_ws/log:/home/ubuntu/robot_ws/log

  robot02-bridge:
    extends:
      file: base.yml
      service: bridge
    container_name: syncai-robot02-bridge
    environment:
      - GRPC_LISTEN_ADDR=:50052
      - ROBOT_ID=robot02
      - ROBOT_API_URL=http://localhost:4000
    volumes:
      - ../data/robot02:/home/ubuntu/data
    depends_on:
      - robot02
 
  robot02-backend:
    extends:
      file: base.yml
      service: backend
    container_name: syncai-robot02-backend
    environment:
      - PORT=4001
      - ROBOT_API_URL=http://localhost:4000
      - BRIDGE_GRPC_ADDRESS=localhost:50052
    depends_on:
      - postgresql
      - temporal