services:
  robot03:
    extends:
      file: base.yml
      service: robot
    container_name: syncai-robot03
    volumes:
      - ../data/robot03:/home/ubuntu/data

  robot03-bridge:
    extends:
      file: base.yml
      service: bridge
    container_name: syncai-robot03-bridge
    environment:
      - ROBOT_ID=robot03
      - ROBOT_API_URL=http://localhost:3000
    volumes:
      - ../data/robot03:/home/ubuntu/data
    depends_on:
      - robot03
 
  robot03-backend:
    extends:
      file: base.yml
      service: backend
    container_name: syncai-robot03-backend
    environment:
      - PORT=3003
      - ROBOT_API_URL=http://localhost:3000
      - BRIDGE_GRPC_ADDRESS=localhost:50051
    depends_on:
      - postgresql
      - temporal