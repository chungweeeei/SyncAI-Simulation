amcl:
  ros__parameters:
    use_sim_time: true
    # Motion model noise - lower = trust odometry more, reduce drift
    # alpha1: rotation noise from rotation (critical for fast rotation drift)
    alpha1: 0.01
    # alpha2: rotation noise from translation
    alpha2: 0.01
    # alpha3: translation noise from translation
    alpha3: 0.01
    # alpha4: translation noise from rotation
    alpha4: 0.01
    alpha5: 0.01
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beams_skip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # More beams = more accurate scan matching
    max_beams: 120
    # More particles = more stable localization during fast motion
    max_particles: 8000
    min_particles: 2000
    pf_err: 0.01
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 2
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 0.5
    # Update very frequently during rotation - critical for fast spin
    update_min_a: 0.02
    update_min_d: 0.05
    # Increase z_hit weight = trust laser matching more
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan