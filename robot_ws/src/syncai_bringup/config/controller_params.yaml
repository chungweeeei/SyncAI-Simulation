controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1
      required_movement_angle: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.2
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8
      lookahead_dist: 0.3
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.523
      # 0.8 was too low: per controller tick (50 ms) the closed-loop ramp
      # added only 0.04 rad/s to the published cmd. Sim's MiR250 chassis
      # (100 kg, ~8 kg*m^2 yaw inertia) can't respond to a 0.04 rad/s pulse
      # within 50 ms, so odom feedback stayed at 0, controller re-ramped from
      # 0 every tick, cmd locked at 0.04 forever. Bumping to 5.0 effectively
      # disables controller-side ramping; velocity_smoother (OPEN_LOOP) is
      # now the only rate limiter in the chain and ramps off its own previous
      # output, breaking the deadlock.
      max_angular_accel: 5.0
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # MiR250 chassis at scale=0.7 (per SyncAI-Omniverse/config/sim_config.yaml
      # robots[*].scale): real MiR250 is 0.80 x 0.58 m, so sim body is
      # 0.56 x 0.40 m -> half-extents (0.28, 0.20). Rectangular footprint
      # (not robot_radius) so a 0.60 m corridor still lets the chassis pass
      # lengthwise. If sim_config.yaml's scale changes, rescale these and the
      # planner_params.yaml global_costmap footprint to match, otherwise
      # RegulatedPurePursuitController spam-rejects valid paths as
      # "collision ahead!" (oversized footprint sweeps through wall cells).
      footprint: "[[0.28, 0.20], [0.28, -0.20], [-0.28, -0.20], [-0.28, 0.20]]"
      transform_tolerance: 2.0
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        filter_info_topic: "/PLACEHOLDER/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.15
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true
