/**:
  ros__parameters:
    use_sim_time: true

ros2_laser_scan_merger:
  ros__parameters:
    use_sim_time: true
    # Topics (relative; PushROSNamespace prepends /<ns>/)
    scanTopic1: scan_front
    scanTopic2: scan_rear
    pointCloudTopic: cloud_in
    # Output PointCloud2 frame id. Launch rewrites to <ns>/scan.
    # Was previously base_link; switched because sim odom reports base_link
    # at z=0 and nav2 voxel layer rejects sensor origins at the boundary.
    pointCloutFrameId: scan

    # laser1 = front-left mount (lidar_link_front in SyncAI-Omniverse mir_amr.py:179)
    show1: true
    flip1: false
    inverse1: false
    laser1XOff: 0.38
    laser1YOff: 0.26
    laser1ZOff: 0.0
    laser1Alpha: 0.0
    laser1AngleMin: -180.0
    laser1AngleMax: 180.0
    laser1R: 255
    laser1G: 0
    laser1B: 0

    # laser2 = rear-right mount (lidar_link_rear in SyncAI-Omniverse mir_amr.py:189)
    # Alpha=180 compensates the 180° Z-rotation applied to the rear RTX sensor
    # prim in run_sim.py (dual_diagonal anti-ghost geometry: rear's open sector
    # faces -X). The LaserScan arrives in the rotated sensor frame; without
    # this rotation the merger projects rear hits to the front of the robot.
    show2: true
    flip2: false
    inverse2: false
    laser2XOff: -0.38
    laser2YOff: -0.26
    laser2ZOff: 0.0
    laser2Alpha: 180.0
    laser2AngleMin: -180.0
    laser2AngleMax: 180.0
    laser2R: 0
    laser2G: 0
    laser2B: 255

    # Robot footprint in base_link frame (axis-aligned box).
    # Points falling inside this box are dropped as self-hits.
    # Front lidar sits at (0.38, 0.26), rear at (-0.38, -0.26); pad ~15 cm past
    # them to also catch self-hits on bumpers / external structures that extend
    # beyond the lidar mount. Tighten if real obstacles near the chassis edges
    # start getting filtered during docking.
    footprintXMin: -0.53
    footprintXMax: 0.53
    footprintYMin: -0.41
    footprintYMax: 0.41

pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true
    # Launch rewrites to <ns>/scan so it matches the merged cloud frame.
    target_frame: scan
    transform_tolerance: 0.05
    min_height: -0.5
    max_height: 1.0
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    # Match the RTX source beam spacing (~1.30° = 0.0227 rad). The older
    # 0.5° output was oversampled 2.6x, producing sparse "+inf gaps between
    # every real beam" and making real obstacles look like flickering speckle
    # in rviz. Run analyze_scan.py after any sim-side lidar change and retune.
    angle_increment: 0.0227
    scan_time: 0.1
    range_min: 0.05
    # Cap at 10 m: at 1.30° beam spacing, arcs >22 cm between neighbors make
    # returns beyond 10 m unreliable (isolated-point rate spikes), and the
    # global costmap rolling window is smaller than this anyway.
    range_max: 10.0
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 16
